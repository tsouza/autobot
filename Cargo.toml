[workspace]
resolver = "3"
members = [
    "crates/autobot-kernel",
    "crates/autobot-kernel-derive",
    "crates/autobot-api",
    "crates/autobot-controllers",
    "crates/autobot-operator",
    "crates/autobot-adapters",
    "crates/autobot-fakes",
    "crates/autobot-testkit",
    "crates/autobot-cli",
    "scripts/devtools",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tsouza/autobot"
publish = false

[workspace.dependencies]
autobot-kernel = { path = "crates/autobot-kernel" }
autobot-kernel-derive = { path = "crates/autobot-kernel-derive" }
autobot-api = { path = "crates/autobot-api" }
autobot-controllers = { path = "crates/autobot-controllers" }
autobot-adapters = { path = "crates/autobot-adapters" }
autobot-fakes = { path = "crates/autobot-fakes" }
autobot-testkit = { path = "crates/autobot-testkit" }
autobot-cli = { path = "crates/autobot-cli" }
anyhow = "1.0.104"
k8s-openapi = { version = "0.28.0", default-features = false }
kube = { version = "4.2.0", default-features = false }
proc-macro2 = "1.0.107"
quote = "1.0.47"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
syn = "3.0.6"
thiserror = "2.0.20"
tokio = "1.53.1"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
trybuild = "1.0.121"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
