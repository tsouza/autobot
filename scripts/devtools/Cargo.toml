[package]
name = "autobot-devtools"
description = "Reusable library behind the AutoBot development scripts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
github = ["dep:ureq"]
hooks = ["dep:regex"]
doctor = ["dep:toml"]
judge = ["github", "dep:ring"]
ledger = ["judge"]
gates = ["dep:autobot-kernel", "dep:sha2"]

# Pinned exactly: rust-script resolves these in its own generated project,
# outside the workspace lock file.
[dependencies]
# The profile digest and the digest text form gate records bind to.
autobot-kernel = { workspace = true, optional = true }
regex = { version = "=1.13.1", optional = true, default-features = false, features = ["std", "unicode"] }
# SHA-256 for the judge request digest: ring is already compiled for ureq's rustls (ring
# provider), so it adds no build under rust-script.
ring = { version = "=0.17.14", optional = true, default-features = false }
serde_json = "=1.0.151"
# SHA-256 of the files a gate record binds to.
sha2 = { version = "=0.11.0", optional = true, default-features = false }
toml = { version = "=1.1.6", optional = true, default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "=3.4.2", optional = true, default-features = false, features = ["rustls", "json"] }

# Test-only: the workflow check parses YAML.
[dev-dependencies]
yaml-rust2 = { version = "=0.13.0", default-features = false }

[lints]
workspace = true
