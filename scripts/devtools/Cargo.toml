[package]
name = "autobot-devtools"
description = "Reusable library behind the AutoBot development scripts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
github = ["dep:ureq"]

# Pinned exactly: rust-script resolves these in its own generated project,
# outside the workspace lock file.
[dependencies]
serde_json = "=1.0.151"
ureq = { version = "=3.4.2", optional = true, default-features = false, features = ["rustls", "json"] }

[lints]
workspace = true
