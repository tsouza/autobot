[package]
name = "autobot-controllers"
description = "AutoBot controllers, Kubernetes store driver, admission, broker and custody."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
autobot-adapters.workspace = true
autobot-kernel.workspace = true
# HMAC-SHA256 of the S3 request signature; ureq's rustls already builds it.
ring.workspace = true
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
# The artifact-store fixture's deployment and names, for the kind-cluster test.
autobot-devtools = { path = "../../scripts/devtools", default-features = false }
proptest.workspace = true

[lints]
workspace = true
