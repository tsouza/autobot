name: Task
description: One reviewable pull request of work, as a scope capsule.
labels: ["type:task"]
body:
  - type: textarea
    id: objective
    attributes: { label: Objective }
    validations: { required: true }
  - type: textarea
    id: design-refs
    attributes: { label: Design refs, description: "Document and § numbers this task implements." }
    validations: { required: true }
  - type: textarea
    id: allowed-paths
    attributes: { label: Allowed paths }
    validations: { required: true }
  - type: textarea
    id: non-goals
    attributes: { label: Non-goals }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance evidence }
    validations: { required: true }
  - type: textarea
    id: owns
    attributes: { label: Owns, description: "Design elements this task is the single owner of (kinds, F-n fixtures, formal modules). Optional." }
