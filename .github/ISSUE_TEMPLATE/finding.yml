name: Finding
description: Something outside a task's scope, reported instead of fixed.
labels: ["finding"]
body:
  - type: dropdown
    id: kind
    attributes: { label: Kind, options: [design, bug, debt] }
    validations: { required: true }
  - type: textarea
    id: observation
    attributes: { label: Observation, description: "What is wrong, with file/line or document §." }
    validations: { required: true }
  - type: textarea
    id: found-in
    attributes: { label: Found in, description: "The task or pull request where it came up." }
    validations: { required: true }
  - type: textarea
    id: owner
    attributes: { label: Owning epic, description: "The epic whose scope this belongs to." }
    validations: { required: true }
