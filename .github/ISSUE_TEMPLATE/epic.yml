name: Epic
description: A parent issue grouping the tasks of one scope within a milestone.
labels: ["type:epic"]
body:
  - type: textarea
    id: scope
    attributes: { label: Scope, description: "What this epic owns, with design refs." }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance }
    validations: { required: true }
