# The gate lane: one job per `just ci-<job>` recipe, each a required check of the ruleset.
# Rust compilations go through sccache on the GitHub Actions cache backend. Every job has the
# same environment, so the `CARGO_*` variables and RUSTFLAGS that enter sccache's key match
# across jobs; incremental compilation is off so workspace crates are cacheable too, and the
# fixed checkout path keeps their keys stable between runs. No job uses secrets or a model.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run, whether pending or in progress. Every
# push to main gets a group of its own, so no main run is ever cancelled or dropped while pending.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Warnings are denied here, never through RUSTFLAGS, which would enter the sccache key.
  CARGO_BUILD_WARNINGS: deny
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # The server logs one line per compilation with the crate name and its cache result;
  # `just sccache-stats` prints them.
  SCCACHE_LOG: sccache::server=debug
  SCCACHE_ERROR_LOG: /tmp/sccache.log

jobs:
  ci:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [fmt, clippy, test, doc, deny, machete]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Toolchain from rust-toolchain.toml; only the cargo registry is cached, sccache holds
      # the build outputs.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-targets: false
          rustflags: ""
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: just,rust-script,cargo-nextest,cargo-deny,cargo-machete
      - run: just "ci-$JOB"
        env:
          JOB: ${{ matrix.job }}
      - if: ${{ !cancelled() }}
        run: just sccache-stats
