# The formal toolchain. `formal` (required) runs on every pull request and push and always
# reports: it passes at once when neither formal/** nor scripts/devtools/src/formal/** changed,
# and otherwise typechecks every module and simulates every check target. `formal-verify` runs
# Apalache over every check target when formal/** changed and every night. Neither job holds a
# model key or a secret.
name: formal

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: formal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formal:
    runs-on: [self-hosted, autobot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: just,rust-script
      - run: just toolchain
      - run: just ci-formal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: formal-digests
          path: target/formal/digests.txt
          if-no-files-found: ignore

  formal-verify:
    runs-on: [self-hosted, autobot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: just,rust-script
      - run: just toolchain
      - run: just ci-formal-verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: formal-verify-digests
          path: target/formal/digests.txt
          if-no-files-found: ignore
