# Posts the `review-gate` commit status on a pull request's head SHA from its latest review
# verdict. Both triggers run the workflow and the gate script from the default branch, so a
# pull request cannot change the gate that judges it; nothing from the pull request is checked
# out or run.
name: review-gate

on:
  issue_comment:
    types: [created, edited]
  pull_request_target: # zizmor: ignore[dangerous-triggers] runs default-branch code only
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

# One evaluation per pull request at a time, so an older run cannot overwrite a newer status.
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review-gate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: just,rust-script
      - run: just review-gate "$PR"
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
