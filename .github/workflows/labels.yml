# The `labels` check: fails a pull request whose changed human-lane paths lack the
# `human-lane` label, or the `design-change` label for docs/design, or whose title is not a
# Conventional Commits header. Adding or removing a label, or editing the title, re-runs it.
# The gate scripts and recipes are checked out from the default branch, so a pull request
# cannot change them; the changed files and labels come from the GitHub API, the title from
# the event and reaches the shell only through the environment. This workflow file itself
# runs from the pull request, so an edit to it is a human-lane change that the reviewer must
# see.
name: labels

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

# A newer event on the same pull request supersedes an older run.
concurrency:
  group: labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: just,rust-script
      - run: just label-gate "$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
      # Until the `pr-title` recipe is on the default branch, the step has nothing to run and
      # reports a warning instead of failing.
      - if: ${{ !cancelled() }}
        run: |
          if just --show pr-title >/dev/null 2>&1; then
            just pr-title "$PR_TITLE"
          else
            echo "::warning::the default branch has no pr-title recipe yet; title not checked"
          fi
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
