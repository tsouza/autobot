# Issue-graph lint: weekly and on demand, never a required pull-request check.
name: dag

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  dag-lint:
    runs-on: [self-hosted, autobot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: just,rust-script
      - run: just toolchain
      - run: just ci-dag-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
